<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Oscilloscope trace">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1A2C"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
  </defs>

  <!-- scope glass -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="url(#glass)" stroke="#223149" stroke-width="3"/>

  <!-- graticule -->
  <g stroke="#2EC5FF" stroke-opacity="0.14" stroke-width="1.5">
    <path d="M22 8V56M42 8V56M8 22H56M8 42H56"/>
  </g>

  <!-- phosphor bloom -->
  <path d="M10 41 H21 V24 H32 V41 H43 V24 H54"
        fill="none" stroke="#2EC5FF" stroke-opacity="0.28"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trace -->
  <path d="M10 41 H21 V24 H32 V41 H43 V24 H54"
        fill="none" stroke="#2EC5FF"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
