name: Validate Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro generates HTML at build time, so validate the build output
      # rather than the repo root (which contains no .html files).
      - name: Build
        run: npm run build

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist

      - name: Check asset sizes
        run: |
          echo "Total build size:"
          du -sh dist
          echo ""
          echo "Anything over 1MB:"
          find dist -type f -size +1M -exec ls -lh {} \; | awk '{print $9 ": " $5}' || true
