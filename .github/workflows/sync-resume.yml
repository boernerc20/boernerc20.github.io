name: Sync Resume from LaTeX-Resume Repo

on:
  # Run automatically every week on Monday at 9 AM
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Trigger when LaTeX-Resume repo is updated (requires webhook setup)
  repository_dispatch:
    types: [resume-updated]

jobs:
  sync-resume:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download latest resume from LaTeX-Resume repo
      run: |
        echo "Fetching latest resume..."
        curl -L -o public/resume.pdf "https://github.com/boernerc20/LaTeX-Resume/raw/main/Christopher_Boerner_Resume.pdf"

        echo "Resume downloaded successfully"
        ls -lh public/resume.pdf

    - name: Check if resume changed
      id: check_changes
      run: |
        git diff --exit-code public/resume.pdf || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push updated resume
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add public/resume.pdf
        git commit -m "chore: update resume from LaTeX-Resume repo

        Automatically synced from https://github.com/boernerc20/LaTeX-Resume

        🤖 Automated by GitHub Actions"
        git push

    - name: Report status
      run: |
        if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
          echo "✅ Resume was updated and pushed"
        else
          echo "ℹ️ Resume is already up-to-date"
        fi
